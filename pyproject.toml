[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "DEBUG"
pythonpath = ["."]
markers = [
    "real_http: set up the genuine http component instead of mocking it (needed by hass_ws_client)",
]

[tool.ruff]
# Deliberately NOT tracking the CI runner's Python (3.14). `target-version` is
# the oldest interpreter the *shipped* integration has to run on, which is set
# by the oldest Home Assistant we claim to support — hacs.json says 2024.11.0,
# and that HA requires Python >= 3.12. Raising this to py313/py314 would let the
# UP rules rewrite this source into syntax that cannot even be imported on an
# older server, so it stays conservative and only moves when the declared HA
# floor moves. See "Home Assistant version compatibility" in AGENTS.md.
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM117", # nested with statements (readability preference)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001", "E402"]  # allow private member access and late imports in tests
