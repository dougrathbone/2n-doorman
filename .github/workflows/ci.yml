name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded PR runs are pointless, but a superseded push to main is not: if a
# run on main is cancelled, nobody ever sees whether main was actually green.
# That is how the last outage stayed invisible. Cancel on pull_request only.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-manifest:
    name: Validate manifest.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate JSON
        run: python -c "import json, sys; json.load(open('custom_components/doorman/manifest.json')); print('manifest.json is valid')"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      # Pinned to the same version as requirements_test.txt — keep the two in
      # lockstep. An unpinned ruff picks up newly stabilised preview rules and
      # fails main on unchanged source, which (via `needs: [..., lint]` below)
      # silently skips the unit tests too.
      - name: Install ruff
        run: pip install ruff==0.16.10
      - name: Run ruff
        run: ruff check custom_components/ tests/

  tests:
    name: Unit tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-manifest, lint, frontend-lint, brand-assets]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Must track requirements_test.txt: pytest-homeassistant-custom-component
          # 0.13.371 requires Python >= 3.14, and the homeassistant 2026.10.0 it
          # pins requires >= 3.14.2. Lowering this does not fail the install — pip
          # quietly resolves to an older PHACC and an older HA, which is exactly
          # how this job spent six months testing HA 2026.2.3.
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Show resolved Home Assistant version
        # Make the system under test visible in the log, so a silent HA
        # downgrade shows up in the run instead of having to be excavated
        # from the pip install output.
        run: |
          python -c "import importlib.metadata as m; print('homeassistant', m.version('homeassistant')); print('pytest-homeassistant-custom-component', m.version('pytest-homeassistant-custom-component'))"
      - name: Run tests with coverage
        run: |
          pytest tests/ --ignore=tests/integration \
            --cov=custom_components/doorman \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=90 \
            -v --tb=short
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
      # Optional: set repository secret CODECOV_TOKEN for coverage trends.
      # Without it this step no-ops rather than failing the job.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # No bundler/ESLint stack — keep the panel zero-build. Syntax-check every
      # ES module so a broken import or typo still fails CI.
      - name: Syntax-check panel modules
        run: |
          set -euo pipefail
          for f in custom_components/doorman/frontend/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

  brand-assets:
    name: Brand asset parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Root brand/ (README/HACS) and custom_components/doorman/brand/ (HA Brands
      # Proxy) must stay byte-identical for the shared PNGs. logo.svg is
      # README-only and lives only under brand/.
      - name: Compare brand PNG trees
        run: |
          set -euo pipefail
          for f in icon.png "icon@2x.png" logo.png "logo@2x.png"; do
            if ! cmp -s "brand/$f" "custom_components/doorman/brand/$f"; then
              echo "::error file=brand/$f::$f differs between brand/ and custom_components/doorman/brand/"
              exit 1
            fi
          done
          echo "Brand PNG trees match."

  # Declared floor from hacs.json ("homeassistant": "2024.11.0"). Primary
  # coverage stays on the current PHACC pin above; this leg proves we still
  # import and pass unit tests against the oldest HA we claim to support.
  tests-floor:
    name: Unit tests (HA floor 2024.11.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate-manifest, lint, frontend-lint, brand-assets]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # PHACC 0.13.181 / HA 2024.11.0 require Python >= 3.12.
          python-version: "3.12"
          cache: pip
      - name: Install floor test dependencies
        run: pip install -r requirements_test_floor.txt
      - name: Show resolved Home Assistant version
        run: |
          python -c "import importlib.metadata as m; print('homeassistant', m.version('homeassistant')); print('pytest-homeassistant-custom-component', m.version('pytest-homeassistant-custom-component'))"
      - name: Run unit tests on HA floor
        # No coverage gate here — the floor job is a compatibility contract,
        # not the coverage enforcer (that stays on the current-HA job).
        run: |
          pytest tests/ --ignore=tests/integration \
            -v --tb=short

  hacs-validate:
    name: HACS Action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
